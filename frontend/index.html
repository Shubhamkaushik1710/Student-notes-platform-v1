<!DOCTYPE html>
<html>

<head>
<title>Student Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3; url=login.html">

<style>
:root{
--bg:#f8faf4;
--surface:#ffffff;
--blue:#1A3D64;
--blue-soft:#8FABD4;
--green:#A1BC98;
--text:#2F3A2F;
--muted:#5D6A59;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:grid;
place-items:center;
padding:24px;
background:
radial-gradient(circle at 15% 15%,rgba(143,171,212,0.24),transparent 32%),
radial-gradient(circle at 85% 80%,rgba(161,188,152,0.28),transparent 34%),
linear-gradient(180deg,#ffffff 0%,var(--bg) 100%);
color:var(--text);
overflow:hidden;
}

.home-shell{
position:relative;
width:min(680px,100%);
padding:46px 34px;
text-align:center;
}

.home-shell::before{
content:"";
position:absolute;
inset:0;
border-radius:30px;
background:rgba(255,255,255,0.78);
border:1px solid rgba(161,188,152,0.18);
box-shadow:0 24px 56px rgba(86,101,81,0.1);
z-index:-1;
}

.logo-orbit{
position:relative;
width:108px;
height:108px;
margin:0 auto 22px;
border-radius:50%;
display:grid;
place-items:center;
background:linear-gradient(135deg,var(--blue),#315f8d);
box-shadow:0 18px 36px rgba(26,61,100,0.22);
animation:float-card 3.4s ease-in-out infinite;
}

.logo-orbit::before{
content:"";
position:absolute;
inset:-12px;
border-radius:50%;
border:2px solid rgba(143,171,212,0.5);
border-top-color:var(--blue);
animation:spin 2.8s linear infinite;
}

.logo-orbit::after{
content:"";
position:absolute;
width:14px;
height:14px;
border-radius:50%;
background:var(--green);
right:2px;
top:18px;
box-shadow:0 0 18px rgba(161,188,152,0.9);
}

.logo-text{
font-size:42px;
font-weight:800;
color:white;
letter-spacing:0;
}

.home-shell h1{
font-size:clamp(32px,6vw,52px);
line-height:1.05;
color:var(--blue);
margin-bottom:14px;
}

.home-shell p{
font-size:16px;
line-height:1.7;
color:var(--muted);
max-width:520px;
margin:0 auto;
}

.loading-row{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:28px;
font-size:14px;
font-weight:700;
color:var(--blue);
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--blue-soft);
animation:dot-pulse 1.1s ease-in-out infinite;
}

.dot:nth-child(2){
animation-delay:0.14s;
}

.dot:nth-child(3){
animation-delay:0.28s;
}

.quick-link{
display:inline-flex;
margin-top:22px;
color:var(--blue);
font-size:14px;
font-weight:700;
text-decoration:none;
}

.spark{
position:fixed;
width:6px;
height:6px;
border-radius:50%;
background:rgba(26,61,100,0.28);
animation:rise 8s linear infinite;
}

.spark.one{
left:12%;
bottom:-20px;
animation-delay:0s;
}

.spark.two{
left:78%;
bottom:-20px;
animation-delay:1.5s;
}

.spark.three{
left:45%;
bottom:-20px;
animation-delay:3s;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

@keyframes float-card{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
}

@keyframes dot-pulse{
0%,100%{
opacity:0.35;
transform:translateY(0);
}
50%{
opacity:1;
transform:translateY(-5px);
}
}

@keyframes rise{
0%{
opacity:0;
transform:translateY(0) scale(0.8);
}
20%{
opacity:1;
}
100%{
opacity:0;
transform:translateY(-110vh) scale(1.6);
}
}

@media (max-width: 520px){
.home-shell{
padding:34px 22px;
}

.logo-orbit{
width:90px;
height:90px;
}

.logo-text{
font-size:34px;
}
}
</style>
</head>

<body>
<span class="spark one"></span>
<span class="spark two"></span>
<span class="spark three"></span>

<main class="home-shell">
<div class="logo-orbit" aria-hidden="true">
<span class="logo-text">N</span>
</div>

<h1>Student Notes</h1>
<p>Opening your study dashboard with shared notes, organized subjects, and faster revision tools.</p>

<div class="loading-row" aria-label="Redirecting to login">
<span>Redirecting to login</span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>

<a class="quick-link" href="login.html">Go now</a>
</main>

<script>
setTimeout(() => {
window.location.href = "login.html"
}, 2600)
</script>
</body>

</html>
