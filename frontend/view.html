<!DOCTYPE html>
<html>

<head>

<title>View Notes</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f7fb;
}

header{
background:#2563eb;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.pdf-container{
width:90%;
height:90vh;
margin:auto;
margin-top:20px;
position:relative;
}

iframe{
width:100%;
height:100%;
border:none;
transition:filter 0.35s ease;
}

.pdf-container.is-locked iframe{
filter:blur(10px);
pointer-events:none;
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin:20px;
}

.action-link,
button{
padding:10px 15px;
background:#2563eb;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
text-decoration:none;
font-size:14px;
display:inline-flex;
align-items:center;
justify-content:center;
}

.download-link{
background:#0f766e;
}

.login-overlay{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center;
padding:24px;
background:rgba(245,247,251,0.56);
backdrop-filter:blur(2px);
}

.pdf-container.is-locked .login-overlay{
display:flex;
}

.login-card{
width:min(420px,100%);
padding:24px;
border-radius:18px;
background:#ffffff;
box-shadow:0 24px 60px rgba(15,23,42,0.18);
text-align:center;
}

.login-card h2{
margin:0 0 10px;
font-size:24px;
color:#111827;
}

.login-card p{
margin:0 0 18px;
line-height:1.6;
color:#4b5563;
}

.login-card a{
display:inline-flex;
align-items:center;
justify-content:center;
padding:11px 16px;
border-radius:10px;
background:#2563eb;
color:#ffffff;
font-weight:700;
text-decoration:none;
}

</style>

</head>

<body>

<header>
View Notes
</header>

<div class="actions">
<button onclick="goBack()">Back to Notes</button>
<a class="action-link download-link" id="downloadLink" href="#">Download Note</a>
</div>

<div class="pdf-container">
<iframe id="pdfViewer"></iframe>
<div class="login-overlay" id="loginOverlay">
<div class="login-card">
<h2>Login first</h2>
<p>You can preview notes for 5 seconds. Please login to keep viewing or download this note.</p>
<a id="loginLink" href="login.html">Login to continue</a>
</div>
</div>
</div>

<script>

const urlParams = new URLSearchParams(window.location.search)

const file = urlParams.get("file")
const noteId = urlParams.get("noteId")
const oauthEmail = urlParams.get("oauthEmail")
const backendBaseUrl = "http://localhost:3000"

if(oauthEmail){
localStorage.setItem("user_email",oauthEmail)
urlParams.delete("oauthEmail")
const cleanUrl = `${window.location.pathname}?${urlParams.toString()}`
window.history.replaceState({},document.title,cleanUrl)
}

const email = localStorage.getItem("user_email")
const isLoggedIn = Boolean(email)
const viewer = document.getElementById("pdfViewer")
const downloadLink = document.getElementById("downloadLink")
const loginLink = document.getElementById("loginLink")
const pdfContainer = document.querySelector(".pdf-container")

if(!file){
window.location.href = "notes.html"
throw new Error("Missing note file")
}

const fileName = file.split("/").pop()
const fileUrl = `${backendBaseUrl}/uploads/${encodeURIComponent(fileName)}`

viewer.src = fileUrl
loginLink.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`

if(isLoggedIn){
downloadLink.href = noteId
? `${backendBaseUrl}/download/${encodeURIComponent(fileName)}?noteId=${encodeURIComponent(noteId)}&email=${encodeURIComponent(email)}`
: `${backendBaseUrl}/download/${encodeURIComponent(fileName)}?email=${encodeURIComponent(email)}`
}else{
downloadLink.href = loginLink.href
downloadLink.addEventListener("click",(event) => {
event.preventDefault()
window.location.href = loginLink.href
})

window.setTimeout(() => {
pdfContainer.classList.add("is-locked")
},5000)
}

function goBack(){
window.location.href = "notes.html"
}

</script>

</body>

</html>
